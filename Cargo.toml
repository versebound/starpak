[workspace]
resolver = "2"
members = ["crates/starpak", "crates/starpak-cli"]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["axp <344573222+versebound@users.noreply.github.com>"]

[workspace.dependencies]
starpak = { path = "crates/starpak" }
thiserror = "2"
memmap2 = "0.9"
zstd = "0.13"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
aes = "0.8"
cbc = "0.1"
globset = "0.4"
crc32c = "0.6"
clap = { version = "4.5", features = ["derive", "env"] }

[profile.release]
debug = 1
lto = "thin"
codegen-units = 4

[profile.bench]
debug = 1
